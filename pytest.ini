[pytest]
asyncio_mode = auto
testpaths = tests security
addopts = -v --tb=short --timeout=45
markers =
    mandatory: tests that must pass before any merge (pipeline core)
    live: tests that call real LLM agents via proxy (slow, non-deterministic)
    mssql: tests that require a real SQL Server instance
    discovery_benchmark: golden-dataset benchmark for the Discovery Engine (opt-in)
