# Golden set — preguntas GLOBALES para el eval GraphRAG (VAL-192 N3)
#
# Preguntas que el análisis plano por-query falla ESTRUCTURALMENTE (cruzan
# result sets que ningún query individual une) y que el modo-comunidad del
# entity graph responde. Cada pregunta lleva:
#   - required_facts: hechos atómicos con placeholder {REF:<clave>} resuelto por
#     scripts/build_global_references.py vía joins deterministas sobre un
#     state.json (demo committable o captura real gitignored). Una pregunta
#     SOLO entra al set si su referencia es computable desde el state — regla
#     de computabilidad: el builder falla fuerte si no puede.
#   - must_include / must_not_include: gate determinista capa-0 (pre-juez).
#   - split: test se CONGELA antes de iterar prompts (4 train / 3 test).
#     Con n=7 esto guarda contra prompt-overfitting, no significancia.
#
# Regla de reemplazo: si en iteración de train el arm FLAT responde bien una
# pregunta, se declara "no global" y se reemplaza (q6 ya cayó: ver status).
#
# Sin datos de cliente: placeholders + fixture sintética en evals/fixtures/.

version: 1
questions:
  - id: q1-exposicion-compuesta
    split: train
    question: >
      ¿Qué porcentaje de la facturación total está en clientes que además
      presentan riesgo de churn o dormancia (>90 días sin comprar)? ¿Cuáles son?
    seed_entities: ["churn", "dormancia", "facturación"]
    required_facts:
      - {fact: "share de facturación en riesgo compuesto", expected: "{REF:q1.exposed_share_pct}", tolerance_pct: 2.0}
      - {fact: "monto expuesto EUR", expected: "{REF:q1.exposed_eur}", tolerance_pct: 1.0}
      # v2 (iteración train): pedir los 20 nombres en 250 palabras era imposible
      # de cumplir — el fact evaluable es el top-5 por LTV.
      - {fact: "top-5 clientes expuestos por LTV", expected: "{REF:q1.exposed_customers_top5}", kind: labels}
    must_not_include:
      # Trampa: sumar churn + dormant SIN deduplicar la intersección.
      - "{REF:q1.naive_double_count_eur}"
    why_flat_fails: "une concentration/ltv × churn_risk × dormant — tres result sets que ningún query cruza; exige dedup de la intersección"

  - id: q2-cross-sell-gap
    split: train
    question: >
      ¿Qué segmento RFM concentra más facturación y qué categorías de producto
      NO ha penetrado todavía? Cuantificá la oportunidad.
    seed_entities: ["segmento", "categoría", "penetración"]
    required_facts:
      - {fact: "segmento líder", expected: "{REF:q2.top_segment}", kind: labels}
      - {fact: "facturación del segmento líder", expected: "{REF:q2.top_segment_eur}", tolerance_pct: 1.0}
      # v2 (iteración train): 20 categorías faltantes no caben en 250 palabras —
      # el fact evaluable es el top-5 por revenue de categoría (los gaps valiosos).
      - {fact: "top-5 categorías sin penetrar (por revenue)", expected: "{REF:q2.missing_categories_top5}", kind: labels}
    granularity_notes: >
      cross_sell es segmento×categoría: cualquier claim cliente→categoría es
      inferencia 2-hop y el juez lo penaliza como groundedness failure.
    why_flat_fails: "requiere agregar ltv por segmento (rfm) Y diferenciar el set de categorías compradas (cross_sell) — join + complemento de conjunto"

  - id: q3-radio-explosion-churn
    # v3: vista en el run congelado v2 → pasa a train (no puede volver a gatear).
    split: train
    question: >
      Si los 3 clientes con mayor deal-risk se van, ¿cuántos EUR de facturación
      anual se golpean, qué % del total representa y qué segmentos toca?
    seed_entities: ["deal-risk", "churn", "segmento"]
    required_facts:
      - {fact: "EUR en riesgo top-3", expected: "{REF:q3.blast_eur}", tolerance_pct: 1.0}
      - {fact: "% del total", expected: "{REF:q3.blast_share_pct}", tolerance_pct: 2.0}
      - {fact: "segmentos golpeados", expected: "{REF:q3.segments_hit}", kind: labels}
    why_flat_fails: "rank por deal_risk (churn_risk) + ltv (concentration) + segmento (rfm) — agregación cruzando tres queries"

  - id: q4-atribucion-hhi
    split: train
    question: >
      ¿La concentración de facturación la explica un solo segmento RFM o cruza
      varios? ¿Qué segmento aporta más share y cuánto?
    seed_entities: ["concentración", "segmento", "share"]
    required_facts:
      - {fact: "segmento con mayor share", expected: "{REF:q4.top_segment}", kind: labels}
      - {fact: "share del segmento líder", expected: "{REF:q4.top_segment_share_pct}", tolerance_pct: 2.0}
      - {fact: "segmento del cliente top-1", expected: "{REF:q4.top1_customer_segment}", kind: labels}
    why_flat_fails: "descompone shares individuales (concentration) agrupando por segmento (rfm) — group-by que no existe en ningún query"

  - id: q5-convergencia-agentes
    split: train
    question: >
      ¿Qué clientes aparecen mencionados en hallazgos de DOS o más agentes
      distintos, y qué dice cada agente sobre ellos?
    seed_entities: ["hallazgos", "agentes", "clientes"]
    required_facts:
      - {fact: "clientes con convergencia multi-agente", expected: "{REF:q5.convergent_customers}", kind: labels}
      - {fact: "agentes que convergen", expected: "{REF:q5.agents_involved}", kind: labels}
    why_flat_fails: "cruza menciones de entidades a través de findings de agentes distintos — grafo MENTIONS, no existe como tabla"

  - id: q6-cobrabilidad-ar
    split: train
    status: replaced
    replaced_reason: >
      Regla de computabilidad: AR por-cliente no está en los states capturados
      (ni demo ni referencia) — la referencia no es computable por joins.
      Reemplazada por q8-puntos-ciegos. Se reintroduce si el query pack suma
      ar_by_customer.
    question: >
      Del AR vencido, ¿cuánto está en clientes activos (recuperable) vs
      dormidos/perdidos (probablemente incobrable)?
    required_facts: []

  - id: q7-columna-vertebral
    # v3: vista en el run congelado v2 → train; y recibe el mismo re-spec top-k
    # que q1/q2 (10 labels eran inevaluables en 250 palabras).
    split: train
    question: >
      ¿Cuál es el subconjunto mínimo de clientes que sostiene el 80% de la
      facturación, y qué fragilidad tiene (riesgo de churn / dormancia dentro
      de ese grupo)?
    seed_entities: ["pareto", "facturación", "riesgo"]
    required_facts:
      - {fact: "tamaño del subconjunto Pareto-80", expected: "{REF:q7.pareto_n}", tolerance_pct: 0.0}
      - {fact: "top-5 clientes frágiles del grupo (por LTV)", expected: "{REF:q7.fragile_members_top5}", kind: labels}
    why_flat_fails: "Pareto acumulado sobre TODOS los clientes (no solo top-10 de un query) + flags de riesgo de otro result set"

  - id: q8-puntos-ciegos
    split: test
    status: replaced
    replaced_reason: >
      Regla de reemplazo (v3): en el state de referencia los puntos ciegos son
      vacíos y "no hay" le sale fácil al flat (0.75 medido en el run congelado
      v2) — no es estructuralmente global EN ESTE STATE. Se revive cuando el
      state de referencia tenga blind spots reales (la demo sí los tiene).
    question: >
      ¿Hay segmentos o grupos de clientes con share de facturación relevante
      (>10%) sobre los que NINGÚN agente reportó hallazgos? ¿Cuáles?
    seed_entities: ["segmento", "hallazgos", "cobertura"]
    required_facts:
      - {fact: "grupos sin cobertura de hallazgos", expected: "{REF:q8.blind_segments}", kind: labels}
      - {fact: "share de los puntos ciegos", expected: "{REF:q8.blind_share_pct}", tolerance_pct: 2.0}
    why_flat_fails: "auto-auditoría del swarm: requiere el complemento del set de menciones (grafo) contra el universo de segmentos con revenue — por construcción solo el grafo lo ve"

  # ── v3: test split NUEVO (re-freeze) — diseñadas desde el catálogo de
  # queries, sin mirar respuestas de ningún arm. Código congelado en v2.2.
  - id: q9-riesgo-por-segmento
    # v4 bookkeeping: vista en el run congelado v3 → train. (En el run v4
    # quedó mal etiquetada como test; no sumó win así que el veredicto v4 no
    # cambia, pero la etiqueta correcta es esta.)
    split: train
    question: >
      ¿Qué segmento RFM concentra el mayor LTV en riesgo de churn (clientes
      con deal_risk_score>0)? ¿Cuánto LTV en riesgo acumula ese segmento y
      cuántos clientes son?
    seed_entities: ["segmento", "churn", "riesgo"]
    required_facts:
      - {fact: "segmento con mayor LTV en riesgo", expected: "{REF:q9.risk_top_segment}", kind: labels}
      - {fact: "LTV en riesgo del segmento líder", expected: "{REF:q9.risk_top_segment_ltv_eur}", tolerance_pct: 1.0}
      - {fact: "clientes en riesgo del segmento líder", expected: "{REF:q9.risk_top_segment_n}", tolerance_pct: 0.0}
    why_flat_fails: "join churn_risk_scoring × rfm_segmentation por customer_id + group-by segmento + suma — ningún query lo trae y las filas crudas no entran juntas en el budget"

  - id: q10-doble-exposicion
    # v4: vista en el run congelado v3 → train (las features de membresía
    # top-N se iteran contra esta).
    split: train
    question: >
      Del top-10 de clientes por facturación, ¿cuáles están ADEMÁS en riesgo
      de churn (deal_risk_score>0), y qué share de la facturación total suman
      esos clientes doblemente expuestos?
    seed_entities: ["concentración", "churn", "riesgo"]
    required_facts:
      - {fact: "clientes doblemente expuestos", expected: "{REF:q10.double_exposed}", kind: labels}
      - {fact: "share de los doblemente expuestos", expected: "{REF:q10.double_exposed_share_pct}", tolerance_pct: 2.0}
      - {fact: "cantidad de doblemente expuestos", expected: "{REF:q10.double_exposed_n}", tolerance_pct: 0.0}
    must_not_include:
      # Trampa: usar el share de TODOS los clientes en riesgo, no la intersección con el top-10.
      - "{REF:q10.all_risky_share_pct}"
    why_flat_fails: "intersección concentration_top_customers ∩ churn_risk_scoring por customer_id — dos result sets que ningún query cruza"

  - id: q13-cobertura-scoring
    # v4: vista en el run congelado v3 → train (la feature de cobertura se
    # itera contra esta).
    split: train
    question: >
      ¿Qué parte de la cartera conocida NO está cubierta por el scoring de
      churn? Cuantificá: cuántos clientes con LTV conocido no tienen
      deal_risk_score y cuánto LTV suman (nombrá los 3 mayores).
    seed_entities: ["churn", "cobertura", "cartera"]
    required_facts:
      - {fact: "clientes sin score", expected: "{REF:q13.unscored_n}", tolerance_pct: 0.0}
      - {fact: "LTV sin cobertura de scoring", expected: "{REF:q13.unscored_ltv_eur}", tolerance_pct: 1.0}
      - {fact: "top-3 sin score por LTV", expected: "{REF:q13.unscored_top3}", kind: labels}
    why_flat_fails: "complemento entre result sets (clientes con LTV en rfm/concentration que NO aparecen en churn_risk_scoring) — razonamiento por ausencia cruzando queries"

  # ── v4: test split NUEVO (re-freeze #2) — diseñadas solo del catálogo de
  # queries; q14 testea la forma group-by ya probada con otro filtro, q15
  # generaliza las features nuevas a una combinación no vista, q16 exige
  # ranking por una dimensión distinta (score, no LTV).
  - id: q14-dormancia-por-segmento
    # v5: vista en el run congelado v4 → train.
    split: train
    question: >
      ¿Qué segmento RFM acumula más LTV dormido (clientes con más de 90 días
      sin comprar)? ¿Cuánto LTV dormido tiene ese segmento y cuántos clientes
      son?
    seed_entities: ["segmento", "dormancia"]
    required_facts:
      - {fact: "segmento con más LTV dormido", expected: "{REF:q14.dormant_top_segment}", kind: labels}
      - {fact: "LTV dormido del segmento líder", expected: "{REF:q14.dormant_top_segment_ltv_eur}", tolerance_pct: 1.0}
      - {fact: "clientes dormidos del segmento líder", expected: "{REF:q14.dormant_top_segment_n}", tolerance_pct: 0.0}
    why_flat_fails: "join recency (rfm/churn) × segmento (rfm) + group-by + suma — mismo gap estructural que q9 con otro filtro"

  - id: q15-top10-sin-score
    # v5: vista en el run congelado v4 → train.
    split: train
    question: >
      Del top-10 de clientes por LTV, ¿cuántos NO tienen score de churn,
      quiénes son y cuánto LTV suman?
    seed_entities: ["scoring", "cobertura", "ltv"]
    required_facts:
      - {fact: "cantidad de top-10 sin score", expected: "{REF:q15.top10_unscored_n}", tolerance_pct: 0.0}
      - {fact: "top-10 sin score (nombres)", expected: "{REF:q15.top10_unscored}", kind: labels}
      - {fact: "LTV de los top-10 sin score", expected: "{REF:q15.top10_unscored_ltv_eur}", tolerance_pct: 1.0}
    why_flat_fails: "membresía top-10 (ranking global por LTV) ∩ ausencia de score — combina los dos gaps estructurales del flat"

  - id: q16-concentracion-del-riesgo
    # v5: vista en el run congelado v4 → train.
    split: train
    question: >
      Dentro de los clientes en riesgo de churn (deal_risk_score>0), ¿qué
      porcentaje de su LTV conjunto concentran los 3 con mayor score? ¿Quiénes
      son?
    seed_entities: ["churn", "riesgo", "concentración"]
    required_facts:
      - {fact: "top-3 por deal_risk_score", expected: "{REF:q16.top3_by_score}", kind: labels}
      - {fact: "share del LTV en riesgo que concentran", expected: "{REF:q16.top3_score_ltv_share_pct}", tolerance_pct: 2.0}
      - {fact: "LTV conjunto de todos los en riesgo", expected: "{REF:q16.risky_total_ltv_eur}", tolerance_pct: 1.0}
    why_flat_fails: "ranking por score (no por LTV) + share dentro del subconjunto en riesgo — doble agregación sobre el join churn×ltv"

  # ── v5: test split NUEVO (re-freeze #3) — q17 compone capacidades probadas
  # (convergencia × share), q18 generaliza el avg del group-by genérico a
  # combinación no vista, q20 abre la dimensión categoría (no testeada).
  - id: q17-peso-convergentes
    # v6: vista en el run congelado v5 → train.
    split: train
    question: >
      Los clientes mencionados en hallazgos de DOS o más agentes distintos:
      ¿qué LTV conjunto suman y qué porcentaje de la facturación total
      representan?
    seed_entities: ["hallazgos", "agentes", "facturación"]
    required_facts:
      - {fact: "clientes convergentes", expected: "{REF:q17.convergent_customers}", kind: labels}
      - {fact: "LTV conjunto de los convergentes", expected: "{REF:q17.convergent_ltv_eur}", tolerance_pct: 1.0}
      - {fact: "share de la facturación", expected: "{REF:q17.convergent_share_pct}", tolerance_pct: 2.0}
    why_flat_fails: "menciones cruzadas entre agentes (grafo MENTIONS) × LTV (otro result set) × share — tres fuentes que ningún query une"

  - id: q18-ltv-promedio-segmento
    # v6: vista en el run congelado v5 → train.
    split: train
    question: >
      ¿Qué segmento RFM tiene el mayor LTV promedio por cliente? ¿Cuánto es
      ese promedio y cuántos clientes tiene el segmento?
    seed_entities: ["segmento", "ltv"]
    required_facts:
      - {fact: "segmento con mayor LTV promedio", expected: "{REF:q18.avg_top_segment}", kind: labels}
      - {fact: "LTV promedio del líder", expected: "{REF:q18.avg_top_segment_avg_ltv_eur}", tolerance_pct: 1.0}
      - {fact: "clientes del segmento líder", expected: "{REF:q18.avg_top_segment_n}", tolerance_pct: 0.0}
    why_flat_fails: "promedio por grupo = suma/count del join ltv×segmento — doble agregación que ningún query trae"

  - id: q20-categoria-lider
    # v6: vista en el run congelado v5 → train.
    split: train
    question: >
      ¿Qué categoría de producto genera más revenue en total, cuánto genera,
      y qué segmentos RFM la compran?
    seed_entities: ["categoría", "segmento", "penetración"]
    required_facts:
      - {fact: "categoría líder por revenue", expected: "{REF:q20.top_category}", kind: labels}
      - {fact: "revenue de la categoría líder", expected: "{REF:q20.top_category_revenue_eur}", tolerance_pct: 1.0}
      - {fact: "segmentos que la compran", expected: "{REF:q20.buying_segments}", kind: labels}
    granularity_notes: >
      cross_sell es segmento×categoría: claims cliente→categoría son
      inferencia 2-hop y el juez los penaliza.
    why_flat_fails: "agregación de revenue por categoría a través de segmentos (cross_sell) + el set de compradores — group-by sobre la dimensión no analizada"

  # ── v6: test split NUEVO (re-freeze #4 — certificación) — sistema y juez
  # CONGELADOS desde v5; estas preguntas certifican generalización pura:
  # combinaciones no vistas de agregados ya servidos genéricamente.
  - id: q22-segmento-sin-cobertura
    split: test
    question: >
      ¿Qué segmento RFM acumula más LTV SIN score de churn (clientes con LTV
      conocido pero sin deal_risk_score)? ¿Cuánto LTV sin scorear tiene ese
      segmento y cuántos clientes son?
    seed_entities: ["segmento", "scoring", "cobertura"]
    required_facts:
      - {fact: "segmento con más LTV sin score", expected: "{REF:q22.unscored_top_segment}", kind: labels}
      - {fact: "LTV sin score del segmento líder", expected: "{REF:q22.unscored_top_segment_ltv_eur}", tolerance_pct: 1.0}
      - {fact: "clientes sin score del segmento líder", expected: "{REF:q22.unscored_top_segment_n}", tolerance_pct: 0.0}
    why_flat_fails: "group-by segmento sobre el COMPLEMENTO del scoring (clientes en rfm/concentration ausentes de churn_risk_scoring) — ausencia + join + agregación"

  - id: q24-doble-top
    split: test
    question: >
      ¿Qué clientes están A LA VEZ en el top-5 por LTV y en el top-5 por
      deal_risk_score? Nombralos y decí cuántos son.
    seed_entities: ["ltv", "deal-risk", "riesgo"]
    required_facts:
      - {fact: "clientes en ambos top-5", expected: "{REF:q24.double_top}", kind: labels}
      - {fact: "cantidad en ambos top-5", expected: "{REF:q24.double_top_n}", tolerance_pct: 0.0}
    why_flat_fails: "intersección de dos rankings globales (LTV de concentration/rfm × score de churn) — ninguno existe completo en un solo query"

  - id: q25-cliente-mas-expuesto
    split: test
    question: >
      Entre los clientes expuestos (riesgo de churn o dormancia >90 días),
      ¿cuál es el de mayor LTV individual, cuánto LTV tiene, y cuánto suma el
      LTV expuesto total?
    seed_entities: ["churn", "dormancia", "ltv"]
    required_facts:
      - {fact: "cliente expuesto de mayor LTV", expected: "{REF:q25.top_exposed_customer}", kind: labels}
      - {fact: "LTV del cliente más expuesto", expected: "{REF:q25.top_exposed_ltv_eur}", tolerance_pct: 1.0}
      - {fact: "LTV expuesto total", expected: "{REF:q25.total_exposed_ltv_eur}", tolerance_pct: 1.0}
    why_flat_fails: "máximo dentro de la unión deduplicada churn∪dormancia (tres result sets) + el total de esa unión"
